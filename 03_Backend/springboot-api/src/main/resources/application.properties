spring.application.name=WaterQualityBackend

# ==========================
# DATABASE CONFIGURATION (Supabase PostgreSQL)
# ==========================

# Database connection for Supabase PostgreSQL (Session Pooler)
spring.datasource.url=${DB_URL:jdbc:postgresql://aws-1-ap-south-1.pooler.supabase.com:5432/postgres?sslmode=require}
spring.datasource.username=${DB_USERNAME:postgres.cevghzamuzpfckazrbtk}
spring.datasource.password=${DB_PASSWORD:#Ganesh8088239071}
spring.datasource.driver-class-name=org.postgresql.Driver

# HikariCP Pooler Settings (Optimized for Supabase Transaction/Session Pooler)
spring.datasource.hikari.max-lifetime=60000
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000
spring.datasource.hikari.keepalive-time=30000
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2

# ==========================
# JPA CONFIGURATION
# ==========================

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ==========================
# SERVER CONFIGURATION
# ==========================

server.port=${PORT:8080}

# ==========================
# LOGGING
# ==========================

logging.level.org.springframework=INFO
logging.level.org.hibernate.SQL=DEBUG
logging.level.org.hibernate.orm.jdbc.bind=TRACE

# ==========================
# GOOGLE OAUTH CONFIGURATION
# ==========================

google.client-id=${GOOGLE_CLIENT_ID:1095651319432-8bciubb89jokk3089ud622eh9rsiloc0.apps.googleusercontent.com}

# ==========================
# ML MICROSERVICE CONFIGURATION
# ==========================

ml.service.url=${ML_SERVICE_URL:http://127.0.0.1:5000}


# ==========================
# MQTT MOSQUITTO BROKER CONFIGURATION
# ==========================

mqtt.broker.url=${MQTT_BROKER_URL:tcp://10.39.71.112:1883}
mqtt.client.id=${MQTT_CLIENT_ID:aqualytica-backend}
mqtt.topic.command=${MQTT_TOPIC_COMMAND:aqualytica/device/command}
mqtt.topic.sensors=${MQTT_TOPIC_SENSORS:aqualytica/sensors}
mqtt.timeout.seconds=${MQTT_TIMEOUT_SECONDS:10}
